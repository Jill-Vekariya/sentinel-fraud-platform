name: Validate fraud platform
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install --require-hashes -r requirements-linux-py312.lock
      - run: pip install -r requirements-dev.txt
      - name: Audit locked Python dependencies with an isolated tool
        run: |
          python -m venv "$RUNNER_TEMP/dependency-audit"
          "$RUNNER_TEMP/dependency-audit/bin/python" -m pip install pip-audit==2.10.1
          "$RUNNER_TEMP/dependency-audit/bin/pip-audit" -r requirements-linux-py312.lock --no-deps --disable-pip
      - run: python -m ruff check fraud scripts tests
      - run: python -m ruff format --check fraud scripts tests
      - run: python -m pytest -q
      - run: python -m compileall -q fraud scripts
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., push: false, tags: 'fraud-platform:ci'}
  streaming:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install httpx==0.28.1 pydantic==2.11.4
      - run: docker compose up --build -d
      - run: docker compose run --rm --no-deps producer python -m fraud.produce --seed 99 --count 20 --delay 0.05
      - run: python -m scripts.check_stream
      - run: timeout 30 docker compose exec -T broker rpk topic consume decisions -n 1
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
  browser-model:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install --require-hashes -r requirements-linux-py312.lock
      - run: python -m fraud.train --promote
      - run: python -m scripts.export_browser_model
      - run: python -m scripts.check_browser_parity
      - run: python -m scripts.check_browser_explanations
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=moderate
      - run: npm run test:hosted
      - run: npm run test:dashboard
  demo-image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: docker build --platform linux/amd64 -f Dockerfile.demo -t sentinel-demo:ci .
      - run: python scripts/check_demo_container.py --image sentinel-demo:ci --output reports/local/demo-container.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-container-verification
          path: reports/local/demo-container*
