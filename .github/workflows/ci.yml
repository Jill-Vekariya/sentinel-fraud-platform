name: Validate fraud platform
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m compileall -q fraud scripts
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., push: false, tags: 'fraud-platform:ci'}
  streaming:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install httpx pydantic
      - run: docker compose up --build -d
      - run: docker compose run --rm --no-deps producer python -m fraud.produce --seed 99 --count 20 --delay 0.05
      - run: python -m scripts.check_stream
      - run: timeout 30 docker compose exec -T broker rpk topic consume decisions -n 1
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
  browser-model:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r requirements.txt
      - run: python -m fraud.train --promote
      - run: python -m scripts.export_browser_model
      - run: python -m scripts.check_browser_parity
      - run: python -m scripts.check_browser_explanations
      - run: npm install
      - run: npm run test:hosted
