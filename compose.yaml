services:
  trainer:
    build: .
    command: ["sh", "-c", "test -f /app/models/current.json || python -m fraud.train --promote"]
    volumes: ["models:/app/models"]
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  broker:
    image: redpandadata/redpanda:v24.3.5
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "512M", "--reserve-memory", "0M", "--node-id", "0", "--check=false", "--kafka-addr", "internal://0.0.0.0:9092", "--advertise-kafka-addr", "internal://broker:9092"]
    volumes: ["broker-data:/var/lib/redpanda/data"]
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "-X", "brokers=localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 30
  topics:
    image: redpandadata/redpanda:v24.3.5
    depends_on:
      broker: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command: ['for topic in transactions decisions transactions.dlq; do rpk topic describe "$$topic" -X brokers=broker:9092 >/dev/null 2>&1 || rpk topic create "$$topic" -p 3 -X brokers=broker:9092 || exit 1; done']
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      API_KEY: ${API_KEY:-local-demo-change-me}
      REDIS_URL: redis://redis:6379/0
    volumes: ["models:/app/models", "data:/app/data"]
    depends_on:
      trainer: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 30
  worker:
    build: .
    command: ["python", "-m", "fraud.worker"]
    restart: on-failure
    environment:
      API_KEY: ${API_KEY:-local-demo-change-me}
      KAFKA_BOOTSTRAP: broker:9092
      API_URL: http://api:8000
    volumes: ["data:/app/data"]
    depends_on:
      api: {condition: service_healthy}
      topics: {condition: service_completed_successfully}
  producer:
    build: .
    profiles: ["demo"]
    command: ["python", "-m", "fraud.produce", "--count", "500"]
    environment: {KAFKA_BOOTSTRAP: "broker:9092"}
    depends_on:
      worker: {condition: service_started}
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    profiles: ["tracking"]
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:////mlflow/mlflow.db", "--default-artifact-root", "/mlflow/artifacts"]
    ports: ["127.0.0.1:5000:5000"]
    volumes: ["tracking:/mlflow"]
volumes:
  models:
  data:
  redis-data:
  broker-data:
  tracking:
